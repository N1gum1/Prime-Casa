<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quartos e Colchões - Prime Casa</title>

    <style>
        body {
            font-family: "Times New Roman", sans-serif;
            background-color: #272727;
            color: #c4c4c4;
            margin: 0;
        }

        .banner {
            position: relative;
            width: 100%;
            height: 420px;
            background-image: url("img/quartos_e_colchoes_faixadas.jpeg");
            background-size: cover;
            background-position: center;
        }

        .banner::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
        }

        .banner-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 0px 0px 10px black;
        }

        .banner-info {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: #eaeaea;
            font-size: 18px;
            z-index: 2;
            text-shadow: 0px 0px 6px black;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding: 30px;
            max-width: 1100px;
            margin: 40px auto;
        }

        .item {
            background-color: #cfcece;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: transform 0.5s;
            cursor: pointer;
        }

        .item:hover {
            transform: translateY(-5px);
        }

        .item img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .item h3 {
            padding: 15px;
            font-size: 1.2em;
            color: #333;
            text-align: center;
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            position: relative;
            background: white;
            padding: 10px;
            border-radius: 10px;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            border-radius: 10px;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 38px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .arrow-left { left: -55px; }
        .arrow-right { right: -55px; }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 32px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="banner">
    <div class="banner-title">Quartos e Colchões</div>
    <div class="banner-info">
        Shopping CasaPark Brasília<br>
        (61) 3233-1464
    </div>
</div>

<div class="product-grid">

    <div class="item" onclick="openModal(0)">
        <img src="img/georgia.jpeg">
        <h3>Georgia</h3>
    </div>

    <div class="item" onclick="openModal(2)">
        <img src="img/black_mod.jpeg">
        <h3>Black Moderate</h3>
    </div>

    <div class="item" onclick="openModal(4)">
        <img src="img/bothanic_plush.jpeg">
        <h3>Bothanic Plush</h3>
    </div>

    <div class="item" onclick="openModal(6)">
        <img src="img/finesse_tec.jpeg">
        <h3>Finesse</h3>
    </div>

    <div class="item" onclick="openModal(8)">
        <img src="img/first_plush.jpeg">
        <h3>First Plush</h3>
    </div>

    <div class="item" onclick="openModal(10)">
        <img src="img/geocites.jpeg">
        <h3>Geocites</h3>
    </div>

    <!-- NOVOS COLCHÕES -->
    <div class="item" onclick="openModal(12)">
        <img src="img/heritage.jpeg">
        <h3>Heritage</h3>
    </div>

    <div class="item" onclick="openModal(14)">
        <img src="img/legacy.jpeg">
        <h3>Legacy</h3>
    </div>

    <div class="item" onclick="openModal(16)">
        <img src="img/evolution.jpeg">
        <h3>Evolution</h3>
    </div>

</div>

<div id="modal" class="modal-bg">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">✖</span>
        <span class="arrow arrow-left" onclick="prev()">❮</span>
        <img id="modal-img">
        <span class="arrow arrow-right" onclick="next()">❯</span>
    </div>
</div>

<script>
const images = [
    "img/georgia.jpeg","img/georgia_ficha.jpeg",
    "img/black_mod.jpeg","img/black_mod_ficha.jpeg",
    "img/bothanic_plush.jpeg","img/bothanic_plush_ficha.jpeg",
    "img/finesse_tec.jpeg","img/finesse_ficha.jpeg",
    "img/first_plush.jpeg","img/first_plush_ficha.jpeg",
    "img/geocites.jpeg","img/geocites_ficha.jpeg",

    /* NOVOS */
    "img/heritage.jpeg","img/heritage_ficha.jpeg",
    "img/legacy.jpeg","img/legacy_ficha.jpeg",
    "img/evolution.jpeg","img/evolution_ficha.jpeg"
];

let index = 0;

function openModal(i){
    index = i;
    document.getElementById("modal-img").src = images[index];
    document.getElementById("modal").style.display = "flex";
}
function closeModal(){
    document.getElementById("modal").style.display = "none";
}
function next(){
    index = (index + 1) % images.length;
    document.getElementById("modal-img").src = images[index];
}
function prev(){
    index = (index - 1 + images.length) % images.length;
    document.getElementById("modal-img").src = images[index];
}
</script>

</body>
</html>
